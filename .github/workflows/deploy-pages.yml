name: Deploy GitHub Pages

on:
  push:
    branches: [main, fix/github-pages-baseurl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Use GitHub Pages project path
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.expo.experiments=j.expo.experiments||{}; j.expo.experiments.baseUrl='/uzay'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
      - run: npx expo export -p web
      - name: Prefix asset URLs for /uzay
        run: |
          node -e "const fs=require('fs'); const p='dist/index.html'; let t=fs.readFileSync(p,'utf8'); t=t.replace(/(href|src)=\"\/(?!uzay\/)/g,'$1=\"/uzay/'); fs.writeFileSync(p,t); console.log(t);"
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
