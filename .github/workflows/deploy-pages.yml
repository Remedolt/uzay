name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Force Pages source to GitHub Actions
        run: |
          code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}') || true
          echo "pages PUT status=$code"
          cat /tmp/pages-put.json || true
          # 204 = ok, 409/422 may already be workflow — do not fail the build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Use GitHub Pages project path
        run: |
          node -e "const fs=require('fs'); const p='app.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.expo.experiments=j.expo.experiments||{}; j.expo.experiments.baseUrl='/uzay'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
      - run: npx expo export -p web
      - name: Add static pages and .nojekyll
        run: |
          touch dist/.nojekyll
          [ -f public/privacy.html ] && cp public/privacy.html dist/privacy.html || true
          [ -f public/gizlilik.html ] && cp public/gizlilik.html dist/gizlilik.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
